name: CI

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Ubuntu
            os: ubuntu-latest
          - os_name: Windows Server
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "yarn"

      - name: Install yarn
        run: npm i -g yarn

      - name: Install dependencies
        run: yarn

      - name: Invoke cli.js
        run: node cli -h
